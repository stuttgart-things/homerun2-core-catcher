---
name: Build, Push & Scan Container Image
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.6"
      registry: ghcr.io
      # The head of the pull request, not the merge commit GitHub checks out
      # by default. The image is tagged `pr-<n>-<head sha>`, the string the
      # preview ApplicationSet composes from its own `.head_sha`, so building
      # anything else puts a name on an artefact that is not what it says.
      ref: ${{ github.event.pull_request.head.sha }}
      tags: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }},pr-${{ github.event.number }}
    secrets: inherit # pragma: allowlist secret

  build-main:
    if: github.event_name != 'pull_request'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-ko-build.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.6"
      # Without these, call-ko-build falls back to its ttl.sh/latest defaults
      # and main images never reach ghcr.io — which left :main frozen at
      # v0.6.1 (2026-03-13) while the docs claimed otherwise (#85).
      registry: ghcr.io
      tags: main
    secrets: inherit # pragma: allowlist secret
