---
name: Comment Preview URL on PR
on:
  pull_request:
    # Note: deliberately no `opened`. When a PR is created with `preview`
    # already attached, GitHub fires both `opened` and `labeled` events
    # back-to-back, and the comment template can't dedupe across two
    # near-simultaneous runs — you end up with two URL comments. The
    # `labeled` event handles the at-creation case just fine on its own.
    types: [reopened, labeled]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  comment:
    # `labeled`: post only when the just-added label is `preview` (the
    # label the AppSet keys on). `reopened`: post only if the PR still
    # has the `preview` label attached — `reopened` doesn't fire a
    # `labeled` event, so we have to check the current label set.
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'reopened' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const num = context.issue.number;
            const url = `https://cc-pr-${num}.homerun2-dev.sthings-vsphere.labul.sva.de`;
            const ns  = `homerun2-core-catcher-pr-${num}`;
            const marker = "<!-- preview-url-bot -->";
            const body = [
              marker,
              "## 🚀 Preview environment",
              "",
              `| | |`,
              `|--|--|`,
              `| URL | ${url} |`,
              `| Namespace | \`${ns}\` on \`homerun2-dev\` |`,
              `| ArgoCD | [\`${ns}\`](https://argocd.platform.sthings-vsphere.labul.sva.de/applications?search=${ns}) |`,
              "",
              "Spinning up — give it a couple of minutes for image + kustomize OCI builds to publish and for ArgoCD to sync.",
              "core-catcher's preview ships with omni-pitcher + redis-stack co-tenanted in the same namespace; a seed Job posts a fixture to /pitch so the dashboard is non-empty when you load it.",
              "Closing this PR tears the preview down automatically.",
            ].join("\n");

            // Sticky comment: update on reopen instead of stacking duplicates.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                body,
              });
            }
