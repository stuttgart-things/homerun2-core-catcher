---
name: Release
on:
  workflow_run:
    workflows: ["Build, Push & Scan Container Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-go-release.yaml@main
    with:
      runs-on: ubuntu-latest
      go-version: "1.26.6"
      stage-image: true
      # Moves :latest onto every release. Without it the pipeline only ever
      # writes the version tag, and :latest sat on v0.2.0 from March while
      # releases reached v0.13.x (#104).
      image-extra-tags: latest
      push-kustomize: true
      kcl-source-dir: kcl
      kcl-profile-file: tests/kcl-deploy-profile.yaml
      # Substitutes the released version into config.image so the published
      # kustomize base pins a real tag. Without this the profile's placeholder
      # ships verbatim, which meant every release shipped :latest — a tag last
      # written on 2026-03-08 (#84).
      kustomize-image-key: config.image
      kustomize-oci-repo: ghcr.io/stuttgart-things/homerun2-core-catcher-kustomize
    secrets: inherit # pragma: allowlist secret
